<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助教答疑平台 - 注册</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #f4f7f6;
            --error-color: #e74c3c;
            --success-color: #2ecc71;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        header h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        /* 验证反馈样式 */
        input:focus:invalid {
            border-color: var(--error-color);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23e74c3c" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
        }
        input:focus:valid {
            border-color: var(--success-color);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%232ecc71" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
        }
        .btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        .btn:hover {
            background-color: #357ABD;
        }
        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .footer-link a {
            color: var(--primary-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>注册 AI 助教账号</h1>
        </header>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="regUsername">用户名 (字母和数字组合)</label>
                <!-- 表单增强：pattern 正则表达式验证 -->
                <input type="text" id="regUsername" name="username" 
                       placeholder="例如: student2026" required 
                       pattern="^[a-zA-Z0-9]+$" title="用户名只能包含字母和数字" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="email">邮箱地址</label>
                <!-- 表单增强：type="email" -->
                <input type="email" id="email" name="email" 
                       placeholder="example@domain.com" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="phone">手机号码</label>
                <!-- 表单增强：type="tel", pattern -->
                <input type="tel" id="phone" name="phone" 
                       placeholder="11位手机号" required 
                       pattern="^1[3-9]\d{9}$" title="请输入正确的11位手机号" autocomplete="tel">
            </div>
            
            <div class="form-group">
                <label for="role">身份选择 (Datalist 增强)</label>
                <!-- HTML5 新特性：datalist -->
                <input list="roles" id="role" name="role" placeholder="点击选择或输入您的身份">
                <datalist id="roles">
                    <option value="学生">
                    <option value="老师">
                    <option value="助教">
                    <option value="其他">
                </datalist>
            </div>
            
            <div class="form-group">
                <label for="regPassword">设置密码 (至少8位)</label>
                <!-- 表单增强：minlength -->
                <input type="password" id="regPassword" name="password" 
                       placeholder="请设置密码" required minlength="8" autocomplete="new-password">
            </div>
            
            <button type="submit" class="btn">注 册</button>
        </form>
        
        <div class="footer-link">
            已有账号？ <a href="login.html">返回登录</a>
        </div>
    </main>

    <script>
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // 实际项目中需要发送请求到后端
            alert('注册成功！即将跳转到登录页面。');
            window.location.href = 'login.html'; // 跳转回登录页
        });
    </script>
</body>
</html>
