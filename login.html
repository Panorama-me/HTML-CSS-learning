<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助教答疑平台 - 登录</title>
    <style>
        /* 这里是CSS3与个性化响应式设计 */
        :root {
            --primary-color: #4A90E2;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --error-color: #e74c3c;
            --success-color: #2ecc71;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        header h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        header p {
            text-align: center;
            color: #777;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-weight: 600;
        }
        input[type="text"], input[type="password"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        /* HTML5表单增强：利用:valid和:invalid伪类 */
        input:focus:invalid {
            border-color: var(--error-color);
            outline: none;
        }
        input:focus:valid {
            border-color: var(--success-color);
            outline: none;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .checkbox-group input {
            margin-right: 0.5rem;
        }
        .btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #357ABD;
        }
        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .footer-link a {
            color: var(--primary-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>AI 助教答疑平台</h1>
            <p>欢迎回来，请登录您的账号</p>
        </header>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <!-- 表单增强：required, placeholder, autocomplete -->
                <input type="text" id="username" name="username" 
                       placeholder="请输入用户名" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <!-- 表单增强：minlength, password类型 -->
                <input type="password" id="password" name="password" 
                       placeholder="请输入密码 (至少8位)" required minlength="8" autocomplete="current-password">
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe" style="font-weight: normal;">记住我 (HTML5 LocalStorage)</label>
            </div>
            
            <button type="submit" class="btn">登 录</button>
        </form>
        
        <div class="footer-link">
            还没有账号？ <a href="register.html">立即注册</a>
        </div>
    </main>

    <script>
        // HTML5 本地存储 LocalStorage 能力应用
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const rememberMe = document.getElementById('rememberMe');

        // 页面加载时，检查是否有记住的用户名
        window.addEventListener('load', () => {
            const savedUsername = localStorage.getItem('aiTutorUsername');
            if (savedUsername) {
                usernameInput.value = savedUsername;
                rememberMe.checked = true;
            }
        });

        // 表单提交事件
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); // 阻止默认提交
            alert('登录成功！(演示环境)');
            
            // 记住我功能逻辑
            if (rememberMe.checked) {
                localStorage.setItem('aiTutorUsername', usernameInput.value);
            } else {
                localStorage.removeItem('aiTutorUsername');
            }
        });
    </script>
</body>
</html>
